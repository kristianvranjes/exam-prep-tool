services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examprep}
      POSTGRES_DB: ${POSTGRES_DB:-examprep}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - material_data:/app/data/materials
    environment:
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      FREELLMAPI_URL: ${FREELLMAPI_DOCKER_URL:-http://host.docker.internal:3001/v1}
      FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:-}
      FREELLMAPI_MODEL: ${FREELLMAPI_MODEL:-auto}
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-12000}
      AI_CONCEPT_CHUNKS_PER_REQUEST: ${AI_CONCEPT_CHUNKS_PER_REQUEST:-3}
      AI_MAX_BATCHES: ${AI_MAX_BATCHES:-32}
      QUESTION_GENERATION_MAX_COUNT: ${QUESTION_GENERATION_MAX_COUNT:-10}
      QUESTION_GENERATION_MAX_CONCEPTS: ${QUESTION_GENERATION_MAX_CONCEPTS:-5}
      QUESTION_GENERATION_RETRIEVAL_TOP_K_MAX: ${QUESTION_GENERATION_RETRIEVAL_TOP_K_MAX:-10}
      QUESTION_GENERATION_MAX_CONTEXT_CHUNKS: ${QUESTION_GENERATION_MAX_CONTEXT_CHUNKS:-12}
      QUESTION_GENERATION_MAX_CONTEXT_CHARS: ${QUESTION_GENERATION_MAX_CONTEXT_CHARS:-16000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-8192}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-4}
      EMBEDDING_BATCH_CHARS: ${EMBEDDING_BATCH_CHARS:-12000}
      EMBEDDING_MAX_CHUNKS: ${EMBEDDING_MAX_CHUNKS:-128}
      EMBEDDING_MAX_TEXT_CHARS: ${EMBEDDING_MAX_TEXT_CHARS:-6000}
      MATERIAL_STORAGE_DIR: /app/data/materials
      MATERIAL_MAX_UPLOAD_BYTES: ${MATERIAL_MAX_UPLOAD_BYTES:-20971520}
      MATERIAL_CHUNK_TARGET_CHARS: ${MATERIAL_CHUNK_TARGET_CHARS:-2500}
      MATERIAL_CHUNK_OVERLAP_CHARS: ${MATERIAL_CHUNK_OVERLAP_CHARS:-250}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-examprep}:${POSTGRES_PASSWORD:-examprep}@db:5432/${POSTGRES_DB:-examprep}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db')"]
      interval: 5s
      timeout: 5s
      retries: 15
  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000', {signal: AbortSignal.timeout(10000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 15s
      start_period: 60s
      retries: 15
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  material_data:
