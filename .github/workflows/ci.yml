name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: examprep
          POSTGRES_PASSWORD: examprep
          POSTGRES_DB: examprep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U examprep -d examprep"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://examprep:examprep@localhost:5432/examprep
      RUN_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest
      - name: Phase 8 migration roundtrip and grading regression tests
        run: |
          alembic downgrade 0007
          alembic upgrade head
          pytest tests/test_grading_database.py tests/test_practice_database.py
      - name: Phase 7 migration roundtrip and practice regression tests
        run: |
          alembic downgrade 0006
          alembic upgrade head
          pytest tests/test_practice_database.py
      - run: alembic downgrade base && alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: curl --fail http://localhost:8000/health && curl --fail http://localhost:8000/health/db && curl --fail http://localhost:3000
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
