name: Checks
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: examprep
          POSTGRES_PASSWORD: examprep
          POSTGRES_DB: examprep_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U examprep -d examprep_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://examprep:examprep@localhost:5432/examprep_e2e
      RUN_DB_TESTS: "1"
      RUN_E2E_SEED_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest
      - name: Latest migration roundtrip and material cleanup regression tests
        run: |
          alembic downgrade 0013
          alembic upgrade head
          pytest tests/test_materials.py tests/test_storage_cleanup.py tests/test_storage_cleanup_migration.py
      - run: alembic downgrade base && alembic upgrade head
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy studio
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: curl --fail http://localhost:8000/health && curl --fail http://localhost:8000/health/db && curl --fail http://localhost:3000
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
  e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      POSTGRES_DB: examprep_e2e
      POSTGRES_PORT: "55460"
      AI_PROVIDER: disabled
      SESSION_SECRET: e2e-only-session-secret-for-disposable-ci
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: cp .env.example .env
      - run: docker compose -p examprep-e2e config --quiet
      - run: docker compose -p examprep-e2e up --build --wait --wait-timeout 240
      - run: docker compose -p examprep-e2e exec -T backend python -m app.e2e_seed
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: frontend/test-results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -p examprep-e2e logs
      - if: always()
        run: docker compose -p examprep-e2e down -v
