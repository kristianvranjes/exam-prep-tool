name: Deploy backend (Azure Container Apps)

# Builds the backend image, pushes it to GitHub Container Registry and rolls it out to
# Azure Container Apps after the Checks workflow passes on a push to main, or on demand.
# A manual run always builds and pushes the image (needed once before the Azure setup);
# the rollout steps run only when the repository variable ACA_DEPLOY_ENABLED is "true".
# See docs/DEPLOY_CONTAINER_APPS.md.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aca
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        vars.ACA_DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Lets azure/login exchange a GitHub OIDC token; no Azure secret is stored.
      id-token: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP || 'examprep' }}
      APP_NAME: ${{ vars.ACA_APP_NAME || 'examprep-api' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Choose the image name
        id: image
        # Registry paths must be lower case.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: INSTALL_EMBEDDINGS=0
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.SHA }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign in to Azure
        if: vars.ACA_DEPLOY_ENABLED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out the new image
        if: vars.ACA_DEPLOY_ENABLED == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ env.SHA }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" --output none --only-show-errors

          # The old revision keeps serving until the new one passes its probes
          # (migrations run first), so wait for the new one to become the ready one.
          for _ in $(seq 1 40); do
            props="$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties -o json)"
            latest="$(jq -r .latestRevisionName <<<"$props")"
            ready="$(jq -r .latestReadyRevisionName <<<"$props")"
            if [ "$latest" = "$ready" ]; then
              echo "Revision $latest is ready."
              echo "FQDN=$(jq -r .configuration.ingress.fqdn <<<"$props")" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "Revision $latest did not become ready; $ready still serves. Last log lines:" >&2
          az containerapp logs show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --revision "$latest" --type console --tail 80 --format text || true
          exit 1

      - name: Check the public health endpoint
        if: vars.ACA_DEPLOY_ENABLED == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "https://$FQDN/health/db"
